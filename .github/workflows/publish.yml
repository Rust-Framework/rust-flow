name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Only the framework-agnostic core (rust-agent-flow) is publishable.
      # The gpui rendering layer and demo depend on git sources and are
      # excluded from crates.io (marked `publish = false`).
      - name: Publish rust-agent-flow
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN / CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi
          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(printf '%s' "$metadata" \
            | jq -r '.packages[] | select(.name=="rust-agent-flow") | .version')"
          if [ "$version" != "${TAG_VERSION}" ]; then
            echo "::error::rust-agent-flow version $version != tag $TAG_VERSION"
            exit 1
          fi
          echo "::group::Publishing rust-agent-flow@$version"
          cargo publish -p rust-agent-flow --token "${CARGO_REGISTRY_TOKEN}"
          echo "::endgroup::"